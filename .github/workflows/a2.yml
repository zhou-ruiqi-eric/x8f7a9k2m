name: a2
on:
  schedule: [{cron: "35 * * * *"}]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: x8-gh, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/p2.py
        env: {DATA_ENCRYPTION_KEY: "${{ secrets.DATA_ENCRYPTION_KEY }}"}
      - uses: actions/upload-artifact@v4
        with: {name: "g-${{ github.run_id }}", path: output/gharchive.csv.gz.enc, retention-days: 1, if-no-files-found: error}
