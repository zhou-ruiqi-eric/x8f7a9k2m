name: a3
on:
  schedule: [{cron: "*/30 * * * *"}]
  workflow_dispatch:
permissions: {contents: read, actions: read}
concurrency: {group: x8-state, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/p3.py
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('output/prepared.csv.gz.enc') != '' }}
        with: {name: "p-${{ github.run_id }}", path: output/prepared.csv.gz.enc, retention-days: 1, if-no-files-found: error}
