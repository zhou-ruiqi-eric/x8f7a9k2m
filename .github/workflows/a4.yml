name: a4
on:
  workflow_run: {workflows: [a3], types: [completed]}
  workflow_dispatch:
permissions: {contents: write, actions: read}
concurrency: {group: x8-state, cancel-in-progress: false}
jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/p4.py --download-prepared
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARE_RUN_ID: ${{ github.event.workflow_run.id }}
      - run: python src/p4.py --publish
        env:
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: fiatdock-data
      - run: git config user.name x8 && git config user.email x8@users.noreply.github.com && git add state/index.json state/clock.json && git commit --amend --no-edit && git push --force-with-lease origin HEAD:main
