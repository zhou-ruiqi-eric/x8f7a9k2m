name: a1
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
    inputs:
      requests: {required: false, default: "5000"}
permissions: {contents: read}
concurrency: {group: x8-events, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python src/p1.py
        env:
          GH_EVENTS_PAT: ${{ secrets.GH_EVENTS_PAT }}
          DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
          REQUESTS_TARGET: ${{ inputs.requests || '5000' }}
      - uses: actions/upload-artifact@v4
        with: {name: "e-${{ github.run_id }}", path: output/events.csv.gz.enc, retention-days: 1, if-no-files-found: error}
